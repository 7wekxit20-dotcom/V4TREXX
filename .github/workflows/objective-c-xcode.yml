name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and package IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build with xcodebuild
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -scheme ThreeOneOSFive \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n 1)
          echo "Found built app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r V4RTEXX_MANAGER.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V4RTEXX_MANAGER.ipa
          path: V4RTEXX_MANAGER.ipa
