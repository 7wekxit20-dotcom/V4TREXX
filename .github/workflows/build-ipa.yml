name: Build V4RTEXX MANAGER IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Build App with xcodebuild
        run: |
          xcodebuild archive \
                     -project ThreeOneOSFive.xcodeproj \
                     -scheme ThreeOneOSFive \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/V4RTEXX_MANAGER.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/V4RTEXX_MANAGER.xcarchive/Products/Applications/*.app Payload/ 2>/dev/null || cp -r build/V4RTEXX_MANAGER.xcarchive/Products/Applications/* Payload/
          zip -r V4RTEXX_MANAGER.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V4RTEXX_MANAGER.ipa
          path: V4RTEXX_MANAGER.ipa
