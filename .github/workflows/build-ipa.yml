name: Build V4RTEXX MANAGER IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build App with xcodebuild
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -target "V4RTEXX MANAGER" \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r V4RTEXX_MANAGER.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V4RTEXX_MANAGER.ipa
          path: V4RTEXX_MANAGER.ipa
